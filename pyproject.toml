[project]
name = "doneproof"
version = "0.1.0"
description = "Evidence-backed verification for AI-completed work"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "google-genai>=1.30,<2",
]

[tool.vercel]
entrypoint = "doneproof.api:app"

[tool.vercel.fastapi.static]
cdn = true
